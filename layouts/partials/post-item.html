<li class="post-item">
  <a class="post-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
  <div class="post-meta">
    <span>{{ .Date.Format "2006-01-02" }}</span>
    <span>{{ .ReadingTime }} min read</span>
    {{ range .Params.tags }}<a class="tag-badge" href="{{ printf "tags/%s/" (. | urlize) | relURL }}">#{{ . }}</a>{{ end }}
  </div>
  {{ with .Params.summary }}<p class="post-summary">{{ . }}</p>{{ else }}<p class="post-summary">{{ .Summary | plainify | truncate 160 }}</p>{{ end }}
</li>
